<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>render regression harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0e1117;
        color: #e6edf3;
        font: 12px ui-monospace, monospace;
      }
      #stage {
        position: relative;
        width: 900px;
        height: 700px;
      }
      #stage canvas {
        display: block;
      }
      #log {
        padding: 8px;
        white-space: pre-wrap;
      }
      .fail {
        color: #f85149;
      }
      .pass {
        color: #3fb950;
      }
    </style>
    <script>
      // three captures window.requestAnimationFrame when the renderer is built,
      // and rAF never ticks under headless virtual time. Override it before the
      // viewer is constructed so frames can be driven by hand.
      window.__pendingFrame = null;
      window.requestAnimationFrame = function (cb) {
        window.__pendingFrame = cb;
        return 1;
      };
      window.cancelAnimationFrame = function () {
        window.__pendingFrame = null;
      };
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <pre id="log"></pre>
    <script type="module">
      import * as THREE from "three";
      import { createViewer } from "/src/viewer.ts";

      const MODEL_BASE = "https://raw.githubusercontent.com";
      const MIN_VISIBLE_PERCENT = 0.5;
      const MIN_POSES_WHEN_ANIMATED = 2;
      const POSES_TO_SAMPLE = 40;
      /**
       * Degrees a bone may move when a clip is evaluated at t=0. Every model in
       * tests/models.json measures 0.0deg — authored animations start at the rest
       * pose — so this carries a wide margin while still catching a discarded rest
       * rotation (the vixen's arms snap 20deg when keyframes are read as absolute).
       */
      const MAX_REST_SNAP_DEGREES = 15;

      const log = (line, cls) => {
        const el = document.createElement("span");
        el.textContent = line + "\n";
        if (cls) el.className = cls;
        document.getElementById("log").append(el);
      };
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Capture the mixer so animation can be stepped deterministically.
      let mixer = null;
      const originalClipAction = THREE.AnimationMixer.prototype.clipAction;
      THREE.AnimationMixer.prototype.clipAction = function (...args) {
        mixer = this;
        return originalClipAction.apply(this, args);
      };

      // Capture the scene and camera to check which side the default view is on.
      let scene = null;
      const originalSceneAdd = THREE.Scene.prototype.add;
      THREE.Scene.prototype.add = function (...args) {
        scene = this;
        return originalSceneAdd.apply(this, args);
      };
      let camera = null;
      const originalProjection = THREE.PerspectiveCamera.prototype.updateProjectionMatrix;
      THREE.PerspectiveCamera.prototype.updateProjectionMatrix = function () {
        camera = this;
        return originalProjection.call(this);
      };

      /**
       * Minecraft/Blockbench models are authored facing -Z (heads sit at negative
       * Z), so a camera on the +Z side of the model is looking at its back.
       */
      function cameraViewsTheBack() {
        if (!camera || !scene) return false;
        const root = scene.children.find((child) => child.isGroup);
        if (!root) return false;
        const box = new THREE.Box3().setFromObject(root);
        if (box.isEmpty()) return false;
        return camera.position.z >= box.getCenter(new THREE.Vector3()).z;
      }

      function runFrame() {
        const cb = window.__pendingFrame;
        if (!cb) return false;
        window.__pendingFrame = null;
        cb(performance.now());
        return true;
      }

      function canvasVisiblePercent() {
        const canvas = document.querySelector("#stage canvas");
        if (!canvas || !runFrame()) return null;
        const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
        if (!gl) return null;
        const w = gl.drawingBufferWidth;
        const h = gl.drawingBufferHeight;
        const pixels = new Uint8Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        let drawn = 0;
        for (let i = 0; i < pixels.length; i += 4) {
          if (
            Math.abs(pixels[i] - 14) > 8 ||
            Math.abs(pixels[i + 1] - 17) > 8 ||
            Math.abs(pixels[i + 2] - 23) > 8
          ) {
            drawn += 1;
          }
        }
        return (100 * drawn) / (w * h);
      }

      /**
       * True if any material's texture was sliced into flipbook frames. A
       * flipbook sets repeat.y to 1/frameCount and nudges offset.y; a plain
       * texture leaves both alone.
       */
      function hasSlicedTexture() {
        if (!scene) return false;
        let sliced = false;
        scene.traverse((node) => {
          const materials = Array.isArray(node.material)
            ? node.material
            : node.material
              ? [node.material]
              : [];
          for (const material of materials) {
            const map = material.map;
            if (map && (map.repeat.y !== 1 || map.offset.y !== 0)) sliced = true;
          }
        });
        return sliced;
      }

      function poseSignature() {
        let signature = "";
        mixer.getRoot().traverse((node) => {
          for (const v of node.quaternion.toArray()) {
            signature += v.toFixed(5) + ",";
            if (!Number.isFinite(v)) signature += "NaN!";
          }
          for (const v of node.position.toArray()) signature += v.toFixed(5) + ",";
        });
        return signature;
      }

      function hasNonFiniteTransform() {
        let bad = false;
        mixer.getRoot().traverse((node) => {
          for (const v of [...node.quaternion.toArray(), ...node.position.toArray()]) {
            if (!Number.isFinite(v)) bad = true;
          }
        });
        return bad;
      }

      const viewer = createViewer(document.getElementById("stage"), {
        onError: (error) => log("viewer error: " + error.message, "fail"),
      });
      viewer.resize();

      const only = new URLSearchParams(location.search).get("only");
      let models = await (await fetch("/tests/models.json")).json();
      if (only) {
        models = models.filter((m) => (m.repo + "/" + m.path).includes(only));
      }

      let failures = 0;

      for (const model of models) {
        const name = model.repo + "/" + model.path;
        const problems = [];

        try {
          const url = MODEL_BASE + "/" + model.repo + "/HEAD/" + model.path;
          const response = await fetch(url);
          if (!response.ok) throw new Error("HTTP " + response.status);

          const text = await response.text();
          const loaded = await viewer.load(text);

          // Snapshot the rest pose *before* any frame drives the mixer, otherwise
          // the pose is already animated and the comparison below is meaningless.
          const restPose = new Map();
          if (mixer) {
            mixer.getRoot().traverse((node) => restPose.set(node.uuid, node.quaternion.clone()));
          }

          const immediate = canvasVisiblePercent();
          if (immediate === null) problems.push("no pixel readback");

          await wait(2500);
          runFrame();
          const settled = canvasVisiblePercent();
          if (settled !== null && settled < MIN_VISIBLE_PERCENT) {
            problems.push("visible " + settled.toFixed(2) + "% < " + MIN_VISIBLE_PERCENT + "%");
          }

          if (immediate === 0 && settled === 0) problems.push("rendered blank");

          if (cameraViewsTheBack()) problems.push("default camera views the model's back");

          // A model with no clips must not animate anything. A texture sliced into
          // flipbook frames flips 20x/second, which is the flicker this guards.
          if (loaded.animations.length === 0 && hasSlicedTexture()) {
            problems.push("static model has a texture sliced into flipbook frames");
          }

          let poseCount = 0;
          let restSnap = 0;
          if (loaded.animations.length > 0 && mixer) {
            // Rotation keyframes are *offsets* from a bone's rest rotation, so
            // evaluating the clip at t=0 must leave every bone essentially where it
            // rests. Treating a keyframe as absolute instead throws the rest
            // rotation away and shows up here as a large instantaneous snap.
            mixer.setTime(0);
            mixer.getRoot().traverse((node) => {
              const before = restPose.get(node.uuid);
              if (!before) return;
              const deg = THREE.MathUtils.radToDeg(before.angleTo(node.quaternion));
              if (deg > restSnap) restSnap = deg;
            });
            // "t=0 equals rest" only holds for clips authored to start at the rest
            // pose, so the failure is gated on the model declaring it — a clip can
            // legitimately open mid-pose. restsnap is reported for every model.
            if (model.expectRestRotationKept && restSnap > MAX_REST_SNAP_DEGREES) {
              problems.push("rest rotation discarded at t=0 (" + restSnap.toFixed(1) + "deg snap)");
            }

            const poses = new Set();
            for (let i = 0; i < POSES_TO_SAMPLE; i += 1) {
              mixer.update(0.1);
              poses.add(poseSignature());
            }
            poseCount = poses.size;
            if (poses.size < MIN_POSES_WHEN_ANIMATED) {
              problems.push("animation frozen (" + poses.size + " pose)");
            }
            if (hasNonFiniteTransform()) problems.push("NaN transform after animating");
          }

          const summary =
            "elements=" + loaded.elements +
            " skipped=" + loaded.skipped +
            " anims=" + loaded.animations.length +
            " poses=" + poseCount +
            " restsnap=" + restSnap.toFixed(1) + "deg" +
            " visible=" + (settled === null ? "?" : settled.toFixed(2) + "%");

          if (problems.length > 0) {
            failures += 1;
            log("FAIL  " + name + "  [" + summary + "]  " + problems.join("; "), "fail");
          } else {
            log("pass  " + name + "  [" + summary + "]");
          }
        } catch (error) {
          failures += 1;
          log("FAIL  " + name + "  threw: " + (error && error.message), "fail");
        }
      }

      log("");
      log(failures === 0 ? "ALL PASS (" + models.length + " models)" : failures + " FAILED of " + models.length,
          failures === 0 ? "pass" : "fail");
      log("RENDER_DONE failures=" + failures + " total=" + models.length);
    </script>
  </body>
</html>
